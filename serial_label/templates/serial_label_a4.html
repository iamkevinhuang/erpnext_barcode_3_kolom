<style>
body { margin: 0; font-family: Arial, sans-serif; }
.page { position: relative; width: 190mm; height: 277mm; page-break-after: always; }
.page:last-child { page-break-after: auto; }
.cell { position: absolute; width: 33mm; height: 15mm; overflow: hidden; }
.qr { position: absolute; left: 1.5mm; top: 1.2mm; width: 12.8mm; height: 12.8mm; }
.date { position: absolute; right: 1.6mm; top: 0.4mm; font-size: 4.5pt; line-height: 1; }
.name { position: absolute; left: 15mm; top: 2.6mm; width: 17mm; height: 6.2mm; font-size: 4.5pt; font-weight: bold; line-height: 1.08; text-transform: uppercase; text-align: center; overflow: hidden; }
.serial { position: absolute; left: 15mm; bottom: 0.6mm; width: 17mm; font-size: 5pt; color: #1565c0; text-align: center; }
</style>
{% for page in pages %}
<div class="page">
  {% for d in page %}
  {% set col = loop.index0 % 4 %}
  {% set rowi = loop.index0 // 4 %}
  <div class="cell" style="left: {{ 5 + col * 36 }}mm; top: {{ 10 + rowi * 16 }}mm;">
    <div class="date">{{ d.date }}</div>
    <img class="qr" src="{{ d.qr }}">
    <div class="name">{{ d.item_name or d.item_code }}</div>
    <div class="serial">{{ d.name }}</div>
  </div>
  {% endfor %}
</div>
{% endfor %}
